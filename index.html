
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCity: 绿色未来协作城市</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'ZCOOL+KuaiLe', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background-color: #f0fdf4;
            transition: background-color 2s ease;
        }
        .grid-cell {
            aspect-ratio: 1 / 1;
            transition: all 0.2s ease;
        }
        .grid-cell:hover {
            transform: scale(1.05);
            z-index: 10;
        }
        .building-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .phase-transition {
            transition: background-color 0.5s ease;
        }

        .smog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(100, 80, 60, 0.4);
            backdrop-filter: blur(2px);
            pointer-events: none;
            z-index: 160;
            opacity: 0;
            transition: opacity 2s ease;
        }
        .smog-active {
            opacity: 1;
        }
    </style>
<script type="importmap">

</head>

</html>
